<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ✅ <link> agora está dentro do <head> -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff1744'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
    <title>Recuperar Senha</title>
</head>
<body>
    <main class="container">
        <h1>Recuperar Senha</h1>

        <p style="text-align: center; margin: 10px 0 20px; font-size: 14px;">
            Digite seu e-mail e enviaremos um link para redefinir sua senha.
        </p>

        <div class="input-box">
            <input id="email" placeholder="Seu e-mail" type="email" required>
            <i class="bx bxs-envelope"></i>
        </div>

        <button type="submit" class="login">Enviar link</button>

        <div class="register-link">
            <p><a href="index.html">← Voltar para o Login</a></p>
        </div>
    </main>
</body>
</html>
