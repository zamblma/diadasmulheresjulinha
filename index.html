<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff1744'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
    <title>Login</title>
</head>

<body>
    <div class="coracoes"></div>
    <div id="toast" class="toast"></div>

    <main class="container">
        <form onsubmit="ValidarLogin(event)">
            <h1>Login</h1>
            <div class="input-box">
                <input id="usuario" placeholder="Usuário" type="email" required autofocus>
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input id="senha" placeholder="Senha" type="password" required>
                <i class="bx bxs-lock-alt"></i>
                <i class="bx bx-show" id="toggleSenha" onclick="toggleSenha()"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="lembrar">
                    Lembrar minha senha
                </label>
                <a href="pgesquecisenha.html">Esqueci minha senha</a>
            </div>

            <button type="submit" class="login">Login</button>

            <div class="register-link">
                <p>Não tem uma conta? <a href="pgcadastro.html">Cadastre-se</a></p>
            </div>
        </form>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="javascript/script.js"></script>
    <script>
        function criarCoracao() {
            const el = document.createElement("div");
            el.classList.add("coracao");
            el.textContent = ["❤️", "💕", "💖", "💗"][Math.floor(Math.random() * 4)];
            el.style.left = Math.random() * 100 + "%";
            el.style.fontSize = (10 + Math.random() * 14) + "px";
            el.style.animationDuration = (10 + Math.random() * 12) + "s";
            el.style.animationDelay = Math.random() * 6 + "s";
            document.querySelector(".coracoes").appendChild(el);
            setTimeout(() => el.remove(), 25000);
        }
        for (let i = 0; i < 8; i++) setTimeout(criarCoracao, i * 500);
        setInterval(criarCoracao, 1500);
    </script>
</body>
</html>
